run_name: baseline
out_dir: runs

data:
  manifest: data/clean/manifest.jsonl
  clean_root: data/clean
  degrade_config: configs/degrade.yaml
  chunk_seconds: 4.0
  val_items: 400            # fixed (seeded) degraded pairs for validation

model:
  n_fft: 2048
  hop: 512
  compress: 0.3
  channels: [32, 64, 128, 256, 256]
  time_strides: [2, 2, 2, 1, 1]
  attn_layers: 2
  attn_heads: 4

loss:
  mrstft: 1.0
  complex: 1.0

train:
  steps: 200000
  batch_size: 8             # fits a 16 GB GPU with bf16 at 4 s chunks
  lr: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 2000
  grad_clip: 1.0
  num_workers: 8            # degradation is CPU-heavy; more workers = faster
  amp: bf16                 # bf16 | fp16 | none
  log_every: 50
  val_every: 2000
  ckpt_every: 5000
