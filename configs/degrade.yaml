# Randomized "phone voice memo of a live set" degradation chain.
# Every training chunk draws fresh parameters. Each stage runs with probability p.
# Ranges are [low, high] and sampled uniformly.

sample_rate: 44100

# Optional folders of real recordings. If empty or missing, synthetic fallbacks are used.
rir_dir: data/rirs      # room impulse responses (.wav/.flac), e.g. OpenAIR / MIT IR survey
noise_dir: data/noise   # crowd, clapping, HVAC, handling noise (.wav/.flac)

stages:
  room:            # acoustic room: real RIR if available, else algorithmic reverb
    p: 0.9
    rir_mix: [0.3, 0.9]
    fallback_reverb:
      room_size: [0.3, 0.95]
      damping: [0.2, 0.8]
      wet_level: [0.15, 0.5]

  distance_eq:     # standing far from the PA / weird balance
    p: 0.7
    tilt_db: [-8, 3]       # negative = duller
    low_shelf_db: [-6, 8]

  noise:           # audience, HVAC, hum (added in the room, before the mic)
    p: 0.8
    snr_db: [6, 35]
    hum_p: 0.15

  phone_mic:       # small capsule: no lows, bumpy response
    p: 1.0
    highpass_hz: [70, 220]
    num_peaks: [1, 3]
    peak_hz: [300, 7000]
    peak_gain_db: [-7, 7]
    peak_q: [0.5, 3.0]

  agc:             # automatic gain control "breathing"
    p: 0.7
    window_s: [0.2, 2.0]
    max_gain_db: [6, 24]
    target_db: [-24, -16]

  compressor:
    p: 0.8
    threshold_db: [-32, -10]
    ratio: [2, 12]
    attack_ms: [0.5, 20]
    release_ms: [40, 400]

  limiter:
    p: 0.6
    threshold_db: [-8, -1]
    release_ms: [30, 200]

  clipping:        # loud kick/chorus overloading the input
    p: 0.4
    drive_db: [0, 14]

  bandwidth:       # resample down and back up (the "downsampling")
    p: 0.8
    sample_rates: [8000, 11025, 16000, 22050, 24000, 32000]

  codec:           # lossy encoding; vbr 0 = best, 10 = worst
    p: 0.8
    mp3_vbr_quality: [3, 9.5]

  gsm:             # rare: phone-call quality
    p: 0.03
